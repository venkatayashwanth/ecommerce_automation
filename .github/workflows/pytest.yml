name: Run Pytest Tests with Video Recording

on:
  push:
    branches: [ecommerce_automation]
  pull_request:
    branches: [ecommerce_automation]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with XVFB and Record Video
        run: |
          mkdir -p recordings
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          ffmpeg -y -video_size 1920x1080 -framerate 25 -f x11grab -i :99 -codec:v libx264 recordings/test_run.mp4 &
          RECORD_PID=$!
          sleep 5  # Wait a bit to ensure ffmpeg is ready
          pytest || true  # Don't stop pipeline if tests fail
          kill $RECORD_PID

      - name: Upload Test Recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: recordings/

      - name: Upload Screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

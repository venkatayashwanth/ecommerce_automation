name: Run Selected Tests with Video

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run selected tests and record video
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 3
          ffmpeg -y -video_size 1920x1080 -framerate 25 -f x11grab -i :99 -codec:v libx264 -preset ultrafast -pix_fmt yuv420p recorded_tests.mp4 &
          FFMPEG_PID=$!
          pytest tests/test_logout.py::test_logout tests/test_checkout.py::test_checkout
          kill $FFMPEG_PID

      - name: Upload Test Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-recording
          path: recorded_tests.mp4
